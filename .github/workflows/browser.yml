name: Browser

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact 40-character commit SHA to test
        required: true
        type: string

concurrency:
  group: browser-${{ inputs.git_sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  APP_URL: http://localhost:3100
  DATABASE_URL: postgresql://scopedelta@127.0.0.1:5432/scopedelta_test
  DATABASE_MIGRATION_URL: postgresql://scopedelta@127.0.0.1:5432/scopedelta_test
  TEST_DATABASE_URL: postgresql://scopedelta@127.0.0.1:5432/scopedelta_test
  BETTER_AUTH_SECRET: browser-${{ github.run_id }}-${{ github.run_attempt }}-scopedelta-tests-only
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  SMTP_FROM: ScopeDelta Browser CI <no-reply@scopedelta.local>

jobs:
  browser:
    name: Browser journeys (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scopedelta_test
          POSTGRES_USER: scopedelta
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scopedelta -d scopedelta_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Check out requested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_sha }}

      - name: Verify exact commit
        env:
          CANDIDATE_SHA: ${{ inputs.git_sha }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "git_sha must be a lowercase 40-character commit SHA." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Build browser application
        run: pnpm build

      - name: Restore Chromium cache
        id: chromium-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and system dependencies
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium # NOSONAR — pinned browser binary only

      - name: Install Chromium system dependencies
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium # NOSONAR — runner system packages only

      - name: Browser tests
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/2

      - name: Upload browser diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics-${{ inputs.git_sha }}-${{ matrix.shard }}-of-2
          path: |
            output/playwright
            output/playwright-report
          if-no-files-found: warn
          retention-days: 7
