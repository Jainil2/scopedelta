name: Fast feedback

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fast-feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  APP_URL: http://localhost:3100
  DATABASE_URL: postgresql://scopedelta@127.0.0.1:5432/scopedelta_test
  DATABASE_MIGRATION_URL: postgresql://scopedelta@127.0.0.1:5432/scopedelta_test
  TEST_DATABASE_URL: postgresql://scopedelta@127.0.0.1:5432/scopedelta_test
  BETTER_AUTH_SECRET: ci-auth-${{ github.run_id }}-${{ github.run_attempt }}-scopedelta-tests-only
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  SMTP_FROM: ScopeDelta CI <no-reply@scopedelta.local>

jobs:
  static-and-unit:
    name: Fast static and unit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify production deploy guard
        run: |
          CONTEXT=production node scripts/netlify-ignore.mjs
          if CONTEXT=production SCOPEDELTA_DEPLOY_ORCHESTRATED=true node scripts/netlify-ignore.mjs; then
            exit 1
          fi
          if CONTEXT=deploy-preview node scripts/netlify-ignore.mjs; then
            exit 1
          fi

      - name: Check migration definitions
        run: pnpm db:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Verify unit coverage evidence
        run: pnpm coverage:verify coverage/unit/lcov.info

      - name: Upload unit coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-coverage-${{ github.sha }}
          path: coverage/unit/lcov.info
          if-no-files-found: error
          retention-days: 14

  database-integration:
    name: Fast PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scopedelta_test
          POSTGRES_USER: scopedelta
          # The service is isolated to this ephemeral runner; no reusable credential exists.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scopedelta -d scopedelta_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply migrations twice
        run: |
          pnpm db:migrate
          pnpm db:migrate

      - name: PostgreSQL integration tests with coverage
        run: pnpm test:integration:coverage

      - name: Verify integration coverage evidence
        run: pnpm coverage:verify coverage/integration/lcov.info

      - name: Upload integration coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-coverage-${{ github.sha }}
          path: coverage/integration/lcov.info
          if-no-files-found: error
          retention-days: 14
