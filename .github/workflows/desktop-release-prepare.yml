name: Prepare signed desktop release

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact reviewed 40-character commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-bundles:
    name: Signed updater bundle (${{ matrix.name }})
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS universal
            os: macos-15
            target: universal-apple-darwin
            bundles: app,dmg
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate requested SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.git_sha }}
        run: test "${#REQUESTED_SHA}" -eq 40 && [[ "$REQUESTED_SHA" =~ ^[0-9a-f]+$ ]]

      - name: Check out exact reviewed SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_sha }}

      - name: Verify exact reviewed SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.git_sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"

      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pinned Rust target
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          if [[ "${{ matrix.target }}" == "universal-apple-darwin" ]]; then
            rustup target add --toolchain 1.98.0 aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add --toolchain 1.98.0 "${{ matrix.target }}"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build update-enabled signed artifacts
        env:
          SCOPEDELTA_CLOUD_ORIGIN: ${{ vars.SCOPEDELTA_CLOUD_ORIGIN }}
          SCOPEDELTA_DESKTOP_UPDATES_REQUIRED: "1"
          SCOPEDELTA_DESKTOP_UPDATER_ENDPOINT: ${{ vars.SCOPEDELTA_DESKTOP_UPDATER_ENDPOINT }}
          SCOPEDELTA_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.SCOPEDELTA_DESKTOP_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      - name: Generate SHA-256 manifest
        run: node scripts/checksum-desktop-artifacts.mjs

      - name: Upload private signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scopedelta-signed-${{ matrix.target }}-${{ inputs.git_sha }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error
          retention-days: 14
