name: Desktop

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact 40-character commit SHA to test and package
        required: true
        type: string

concurrency:
  group: desktop-${{ inputs.git_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-checks:
    name: Desktop Rust and TypeScript
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_sha }}

      - name: Verify exact candidate
        env:
          CANDIDATE_SHA: ${{ inputs.git_sha }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "git_sha must be a lowercase 40-character commit SHA." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build bundled selector
        run: pnpm desktop:web:build

      - name: Check formatting
        run: pnpm format:check

      - name: Lint TypeScript
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Test desktop server and browser bridge contracts
        env:
          BETTER_AUTH_SECRET: desktop-ci-contract-secret-at-least-32-characters
        run: pnpm exec vitest run src/server/desktop.test.ts src/app/api/v1/desktop src/components/desktop-notification-bridge.test.tsx

      - name: Check Rust formatting
        run: cargo +1.98.0 fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust
        run: cargo +1.98.0 clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust security boundary
        run: cargo +1.98.0 test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check locked malicious crate denylist
        run: node scripts/check-rust-supply-chain.mjs

      - name: Audit Rust advisories
        run: |
          cargo +1.98.0 install cargo-audit --version 0.22.0 --locked
          cargo +1.98.0 audit --file src-tauri/Cargo.lock

  windows-preference-test:
    name: Windows preference replacement
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_sha }}

      - name: Verify exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.git_sha }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "git_sha must be a lowercase 40-character commit SHA." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build bundled selector
        run: pnpm desktop:web:build

      - name: Test replacement of an existing preferences file
        run: cargo +1.98.0 test --locked --manifest-path src-tauri/Cargo.toml preference_persistence_replaces_existing_file

  desktop-bundles:
    name: Desktop bundle (${{ matrix.name }})
    needs: desktop-checks
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            artifact: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            command: pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis
            bundlePath: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
          - name: Windows x64 offline WebView2
            artifact: windows-x64-offline-webview2
            os: windows-2025
            target: x86_64-pc-windows-msvc
            command: pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.offline-webview2.conf.json
            bundlePath: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
          - name: macOS universal
            artifact: macos-universal
            os: macos-15
            target: universal-apple-darwin
            command: pnpm exec tauri build --target universal-apple-darwin --bundles app,dmg
            bundlePath: src-tauri/target/universal-apple-darwin/release/bundle
          - name: Linux x64
            artifact: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            command: pnpm exec tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb
            bundlePath: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_sha }}

      - name: Verify exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.git_sha }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "git_sha must be a lowercase 40-character commit SHA." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pinned Rust target
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          if [[ "${{ matrix.target }}" == "universal-apple-darwin" ]]; then
            rustup target add --toolchain 1.98.0 aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add --toolchain 1.98.0 "${{ matrix.target }}"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build private beta installers
        env:
          SCOPEDELTA_CLOUD_ORIGIN: ${{ vars.SCOPEDELTA_CLOUD_ORIGIN }}
        run: ${{ matrix.command }}

      - name: Generate SHA-256 manifest
        run: node scripts/checksum-desktop-artifacts.mjs

      - name: Upload private build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scopedelta-desktop-${{ matrix.artifact }}-${{ inputs.git_sha }}
          path: ${{ matrix.bundlePath }}
          if-no-files-found: error
          retention-days: 14
