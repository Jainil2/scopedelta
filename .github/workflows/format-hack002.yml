name: Format HACK-002

on:
  push:
    branches:
      - codex/hack-002-judge-workflow

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: format HACK-002 files'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: codex/hack-002-judge-workflow

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format HACK-002 files
        run: |
          pnpm exec prettier --write 'src/app/app/[workspaceSlug]/projects/[projectKey]/commercial/page.tsx' 'src/app/app/[workspaceSlug]/projects/[projectKey]/page.tsx' 'src/app/globals.css'

      - name: Commit formatter output
        run: |
          if git diff --quiet -- 'src/app/app/[workspaceSlug]/projects/[projectKey]/commercial/page.tsx' 'src/app/app/[workspaceSlug]/projects/[projectKey]/page.tsx' 'src/app/globals.css'; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'ScopeDelta CI'
          git config user.email 'ci@scopedelta.local'
          git add 'src/app/app/[workspaceSlug]/projects/[projectKey]/commercial/page.tsx' 'src/app/app/[workspaceSlug]/projects/[projectKey]/page.tsx' 'src/app/globals.css'
          git commit -m 'chore: format HACK-002 files'
          git push origin HEAD:codex/hack-002-judge-workflow
