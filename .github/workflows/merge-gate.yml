name: Merge candidate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character PR head SHA approved as the merge candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: merge-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  APP_URL: http://localhost:3100
  DATABASE_URL: postgresql://scopedelta@127.0.0.1:5432/scopedelta_test
  DATABASE_MIGRATION_URL: postgresql://scopedelta@127.0.0.1:5432/scopedelta_test
  TEST_DATABASE_URL: postgresql://scopedelta@127.0.0.1:5432/scopedelta_test
  BETTER_AUTH_SECRET: ci-auth-${{ github.run_id }}-${{ github.run_attempt }}-scopedelta-tests-only
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  SMTP_FROM: ScopeDelta CI <no-reply@scopedelta.local>

jobs:
  exact-sha:
    name: Exact SHA guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out merge candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify dispatched branch head
        env:
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != "branch" ]]; then
            echo "Merge candidates must be dispatched against a PR branch." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a lowercase 40-character commit SHA." >&2
            exit 1
          fi
          if [[ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]]; then
            echo "Dispatched ref resolved to $ACTUAL_SHA, not approved SHA $EXPECTED_SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "Checked-out commit does not match the approved SHA." >&2
            exit 1
          fi

  static-and-unit:
    name: Full static and unit
    needs: exact-sha
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify production deploy guard
        run: |
          CONTEXT=production node scripts/netlify-ignore.mjs
          if CONTEXT=production SCOPEDELTA_DEPLOY_ORCHESTRATED=true node scripts/netlify-ignore.mjs; then
            exit 1
          fi
          if CONTEXT=deploy-preview node scripts/netlify-ignore.mjs; then
            exit 1
          fi

      - name: Check migration definitions
        run: pnpm db:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Verify unit coverage evidence
        run: pnpm coverage:verify coverage/unit/lcov.info

      - name: Upload unit coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-candidate-unit-coverage-${{ github.sha }}
          path: coverage/unit/lcov.info
          if-no-files-found: error
          retention-days: 14

  database-integration:
    name: Full PostgreSQL integration
    needs: exact-sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scopedelta_test
          POSTGRES_USER: scopedelta
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scopedelta -d scopedelta_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply migrations twice
        run: |
          pnpm db:migrate
          pnpm db:migrate

      - name: PostgreSQL integration tests with coverage
        run: pnpm test:integration:coverage

      - name: Verify integration coverage evidence
        run: pnpm coverage:verify coverage/integration/lcov.info

      - name: Upload integration coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-candidate-integration-coverage-${{ github.sha }}
          path: coverage/integration/lcov.info
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Full browser journeys
    needs: exact-sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scopedelta_test
          POSTGRES_USER: scopedelta
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scopedelta -d scopedelta_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Restore Chromium cache
        id: chromium-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and system dependencies
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium # NOSONAR — browser binary only

      - name: Install Chromium system dependencies
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium # NOSONAR — system packages only

      - name: Browser tests
        run: pnpm test:e2e

  production:
    name: Full production build and container
    needs: exact-sha
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Production HTTP smoke test
        run: |
          pnpm start --port 3200 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3200/ | grep --quiet "Turn scope creep into approved"; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Build production container
        run: docker build --tag scopedelta:merge-candidate .

  merge-gate:
    name: Full merge gate
    if: always()
    needs:
      - exact-sha
      - static-and-unit
      - database-integration
      - browser
      - production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every exact-SHA gate
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          DATABASE_RESULT: ${{ needs.database-integration.result }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GUARD_RESULT: ${{ needs.exact-sha.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
          STATIC_RESULT: ${{ needs.static-and-unit.result }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          if [[ "$GUARD_RESULT" != "success" || "$STATIC_RESULT" != "success" || "$DATABASE_RESULT" != "success" || "$BROWSER_RESULT" != "success" || "$PRODUCTION_RESULT" != "success" ]]; then
            echo "One or more full-gate jobs did not succeed." >&2
            exit 1
          fi
          if [[ "$EXPECTED_SHA" != "$VALIDATED_SHA" ]]; then
            echo "The validated SHA no longer matches the approved candidate." >&2
            exit 1
          fi
          echo "Full merge gate passed for exact candidate $VALIDATED_SHA."
