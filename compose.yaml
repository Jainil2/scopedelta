name: scopedelta

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scopedelta}
      POSTGRES_USER: ${POSTGRES_USER:-scopedelta}
      POSTGRES_PASSWORD:
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - scopedelta-postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  migrate:
    build:
      context: .
      target: migration
    command: pnpm db:migrate
    environment: &app-environment
      APP_URL: http://localhost:3000
      DATABASE_URL:
      DATABASE_MIGRATION_URL:
      BETTER_AUTH_SECRET:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM: ScopeDelta <no-reply@scopedelta.local>
      AI_ENABLED:
      AI_PROVIDER:
      AI_MODEL:
      OPENAI_API_KEY:
      OPENAI_BASE_URL:
      ANTHROPIC_API_KEY:
      ANTHROPIC_BASE_URL:
      GEMINI_API_KEY:
      GEMINI_BASE_URL:
      OLLAMA_BASE_URL:
      AI_TIMEOUT_MS:
      AI_RESPONSE_MAX_BYTES:
      AI_CONTEXT_MAX_CHARACTERS:
      AI_OUTPUT_MAX_TOKENS:
      AI_RUNNING_PER_USER:
      AI_RUNNING_PER_WORKSPACE:
      AI_STARTS_PER_USER_HOUR:
      AI_STARTS_PER_WORKSPACE_DAY:
      DISTRIBUTION_MODE: ${DISTRIBUTION_MODE:-self_host}
      BILLING_ENTRY_PLAN_KEY:
      BILLING_PLANS_JSON:
      BILLING_GRACE_DAYS:
      BILLING_ALLOW_MANAGED_ACTIONS_DURING_GRACE:
      MANAGED_AI:
      MANAGED_EMAIL:
      PADDLE_ENVIRONMENT:
      PADDLE_API_KEY:
      PADDLE_WEBHOOK_SECRET:
      PADDLE_API_BASE_URL:
      PADDLE_HOSTED_CHECKOUT_URL:
      PADDLE_TIMEOUT_MS:
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment: *app-environment
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  scopedelta-postgres:
