name: scopedelta

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scopedelta
      POSTGRES_USER: scopedelta
      POSTGRES_PASSWORD: scopedelta_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopedelta -d scopedelta"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - scopedelta-postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  migrate:
    build:
      context: .
      target: migration
    command: pnpm db:migrate
    environment: &app-environment
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://scopedelta:scopedelta_local_only@postgres:5432/scopedelta
      DATABASE_MIGRATION_URL: postgresql://scopedelta:scopedelta_local_only@postgres:5432/scopedelta
      BETTER_AUTH_SECRET: local-development-secret-change-before-production
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM: ScopeDelta <no-reply@scopedelta.local>
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment: *app-environment
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  scopedelta-postgres:
