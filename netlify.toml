[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  PNPM_FLAGS = "--frozen-lockfile --shamefully-hoist"
  NEXT_TELEMETRY_DISABLED = "1"

[context.production]
  ignore = "node scripts/netlify-ignore.mjs"

[[headers]]
  for = "/*"

  [headers.values]
    Origin-Agent-Cluster = "?1"
    Permissions-Policy = "tools=(self)"
