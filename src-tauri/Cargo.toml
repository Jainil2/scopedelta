[package]
name = "scopedelta-desktop"
version = "0.1.0"
description = "ScopeDelta cross-platform desktop client"
authors = ["ScopeDelta"]
edition = "2024"
rust-version = "1.98.0"

[lib]
name = "scopedelta_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
open = "5.3.2"
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
tauri-plugin-updater = "2.10.0"
tauri-plugin-window-state = "2.4.1"
time = { version = "0.3.55", features = ["parsing"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
httpmock = "0.8.2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
